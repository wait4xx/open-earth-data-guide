name: stats

# Daily README stat charts (npm downloads + GitHub stars) as SVGs under
# docs/stats/, generated by scripts/render-stats.mjs (zero dependencies).
# Committed by github-actions[bot]; README embeds them via relative paths.

on:
  schedule:
    - cron: "30 16 * * *" # daily 16:30 UTC (00:30 Beijing)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render charts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/render-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/stats; then
            echo "charts unchanged"
            exit 0
          fi
          git add docs/stats
          git commit -m "chore(stats): refresh charts [skip ci]"
          git push
